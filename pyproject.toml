[build-system]
requires = ["setuptools>=77.0.3"]
build-backend = "setuptools.build_meta"

[project]
name = "hyperloop-optimizer"
version = "0.1.1"
description = "A local multi-objective black-box optimizer for opaque command-line workers"
readme = "README.md"
requires-python = ">=3.13.14,<3.14"
license = "MIT"
license-files = ["LICENSE"]
authors = [
  {name = "Absolute-Convergence"},
  {name = "et4v"},
  {name = "wreilly245"},
  {name = "Clfreeman22"},
  {name = "KendahlFranklin"},
]
keywords = [
  "black-box optimization",
  "multi-objective optimization",
  "pareto front",
]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Environment :: Console",
  "Intended Audience :: Science/Research",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.13",
  "Topic :: Scientific/Engineering",
]
dependencies = [
  "numpy>=2.0",
  "matplotlib>=3.11",
]

[project.scripts]
hyperloop-optimizer = "black_box_optimizer.cli:installed_main"
hyperloop-synthetic-worker = "hyperloop_workers.synthetic_worker:main"

[project.urls]
Homepage = "https://github.com/Absolute-Convergence/CSCI-3038-Final_Project"
Issues = "https://github.com/Absolute-Convergence/CSCI-3038-Final_Project/issues"
Source = "https://github.com/Absolute-Convergence/CSCI-3038-Final_Project"

[tool.setuptools.packages.find]
where = ["."]
include = ["black_box_optimizer*", "hyperloop_workers*"]
exclude = ["examples*", "tests*"]
