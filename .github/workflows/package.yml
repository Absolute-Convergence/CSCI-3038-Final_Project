name: Package and core compatibility

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  package:
    name: Build distributions
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13.14"
          cache: pip
      - name: Install release tooling
        run: python -m pip install -r requirements-release.txt
      - name: Build wheel and source distribution
        run: python -m build
      - name: Validate distribution metadata and README
        run: python -m twine check dist/*
      - name: Upload validated distributions
        uses: actions/upload-artifact@v7
        with:
          name: hyperloop-distributions
          path: dist/*
          if-no-files-found: error
          retention-days: 7

  core:
    name: Core (${{ matrix.os }})
    needs: package
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]

    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13.14"
          cache: pip
      - name: Download validated distributions
        uses: actions/download-artifact@v8
        with:
          name: hyperloop-distributions
          path: dist
      - name: Install the exact release wheel
        run: >-
          python -c
          "from pathlib import Path; import subprocess, sys;
          wheels = tuple(Path('dist').glob('*.whl'));
          assert len(wheels) == 1, wheels;
          subprocess.check_call(
          [sys.executable, '-m', 'pip', 'install', str(wheels[0])])"
      - name: Validate installed dependencies
        run: python -m pip check
      - name: Run core-compatible test suite
        run: python -m unittest discover -s tests -p "test_*.py"
      - name: Check source hygiene
        run: python tools/check_monoliths.py
      - name: Run installed synthetic smoke test
        run: >-
          hyperloop-optimizer
          examples/zdt1_benchmark/synthetic_config.json
          --output-dir "${{ runner.temp }}/hyperloop-runs"
