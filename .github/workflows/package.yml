name: Package and core compatibility

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  core:
    name: Core (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]

    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v6
        with:
          python-version: "3.13.14"
          cache: pip
      - name: Install Hyperloop core
        run: python -m pip install .
      - name: Run core-compatible test suite
        run: python -m unittest discover -s tests -p "test_*.py"
      - name: Check source hygiene
        run: python tools/check_monoliths.py
      - name: Run installed synthetic smoke test
        run: >-
          hyperloop-optimizer
          examples/zdt1_benchmark/synthetic_config.json
          --output-dir "${{ runner.temp }}/hyperloop-runs"

  package:
    name: Build distributions
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v6
        with:
          python-version: "3.13.14"
          cache: pip
      - name: Install release tooling
        run: python -m pip install -r requirements-release.txt
      - name: Build wheel and source distribution
        run: python -m build
      - name: Validate distribution metadata and README
        run: python -m twine check dist/*
